    <header class="site-header">
      <div class="container header-inner">
        <a class="wordmark" href="index.html" aria-label="Manchester Stein Workshop home">
          <span class="bee" aria-hidden="true">
            <svg viewBox="0 0 120 110" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g
                stroke="currentColor"
                stroke-width="3.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M53 43C36 6 8 17 17 39c6 15 24 20 36 18M67 43c17-37 45-26 36-4-6 15-24 20-36 18M49 56C22 46 14 63 26 72c8 6 19 2 26-3M71 56c27-10 35 7 23 16-8 6-19 2-26-3"
                />
                <path d="M54 27l-8-9m20 9 8-9M46 67l-9 14m37-14 9 14M47 76l-6 16m32-16 6 16" />
                <path
                  d="M47 44c0-8 6-14 13-14s13 6 13 14M60 41c-25 0-22 41 0 57 22-16 25-57 0-57Z"
                  fill="currentColor"
                />
              </g>
              <g stroke="var(--bee-cutout,#660099)" stroke-width="6">
                <path d="M44 59h32M45 73h30M50 87h20" />
              </g>
            </svg>
          </span>
          <span class="wordmark-text">
            <span class="wordmark-title">Stein's Method and Statistics</span>
            <span class="wordmark-year">MANCHESTER 2027</span>
          </span>
        </a>
        <nav aria-label="Main navigation">
          <a href="index.html"{{current:index}}>Home</a>
          <a href="programme.html"{{current:programme}}>Programme</a>
          <a href="registration.html"{{current:registration}}>Registration &amp; Posters</a>
          <a href="travel.html"{{current:travel}}>Travel</a>
        </nav>
        <div class="header-controls" role="group" aria-label="Display preferences">
          <button
            class="theme-toggle"
            type="button"
            aria-label="Switch to dark mode"
            title="Switch to dark mode"
            hidden
          >
            <svg
              class="moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              aria-hidden="true"
            >
              <path d="M20.5 13.2A8.5 8.5 0 0 1 10.8 3.5 8.5 8.5 0 1 0 20.5 13.2Z" /></svg
            ><svg
              class="sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1m0-15.6-2.1 2.1M6.3 17.7l-2.1 2.1"
              />
            </svg>
          </button>
          <button
            class="bee-cursor-toggle"
            type="button"
            aria-label="Bee cursor"
            aria-pressed="true"
            title="Bee cursor on — switch to standard pointer"
            hidden
          >
            <svg class="cursor-switch-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <path d="M5 27 27 5" stroke="currentColor" stroke-width="1.3" />
              <g class="cursor-switch-bee">
                <g
                  class="cursor-switch-glyph"
                  stroke="currentColor"
                  stroke-width="1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M9 9C5 3 1.5 7 5 10l4 1m3-2c4-6 7.5-2 4 1l-4 1M8 11c-5-2-5 3-1 3l2-1m4-2c5-2 5 3 1 3l-2-1"
                  />
                  <path d="m9.2 4.5-1-2m3.6 2 1-2" />
                  <ellipse cx="10.5" cy="11.8" rx="3.1" ry="4.4" fill="var(--gold)" />
                  <path d="M7.5 11.5h6m-5.6 2.4h5.2m-2.6 2.3v1.3" />
                  <circle
                    class="cursor-switch-head"
                    cx="10.5"
                    cy="6.7"
                    r="2.5"
                    fill="var(--gold)"
                  />
                </g>
              </g>
              <g class="cursor-switch-pointer">
                <g class="cursor-switch-glyph">
                  <path d="m20 18 1 11 2.5-3 2 3 1.5-1-2-3 4-.5Z" fill="currentColor" />
                </g>
              </g>
            </svg>
          </button>
        </div>
      </div>
    </header>
